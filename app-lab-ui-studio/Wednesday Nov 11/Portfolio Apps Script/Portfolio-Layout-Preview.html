<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio layout preview</title>
<style>
:root{--ink:#243140;--muted:#5e6c7b;--blue:#245c83;--line:#d7dfe6;--paper:#fff;--soft:#f6f8fa}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--blue)}
header{border-bottom:1px solid var(--line);padding:30px 4vw 24px}header .wrap,main{max-width:1260px;margin:auto}
h1,h2,h3{font-family:Georgia,serif;line-height:1.15}h1{font-size:clamp(2.3rem,5vw,4.6rem);margin:0 0 6px}h2{font-size:2.2rem;margin:0 0 8px}h3{font-size:1.45rem;margin:15px 0 7px}
.intro{margin:0;color:var(--muted);max-width:730px}.topline{display:flex;gap:15px;justify-content:space-between;align-items:end;flex-wrap:wrap}
.course-picker{display:flex;align-items:center;gap:9px;font-size:.91rem;color:var(--muted)}select{border:1px solid #aebdca;background:#fff;padding:8px}
nav{display:flex;gap:28px;overflow-x:auto;margin-top:25px}nav button{border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font-weight:700;padding:7px 0 9px;white-space:nowrap}
nav button[aria-current="page"]{color:var(--blue);border-color:var(--blue)}
main{padding:32px 4vw 90px}.guide{font-size:1.08rem;color:var(--muted);max-width:800px;margin:0 0 30px}.guide strong{color:var(--ink)}
.jump{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 34px}.jump a{text-decoration:none;border-bottom:1px solid currentColor;font-size:.91rem}
.section{margin:0 0 70px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:22px}.section-head p{margin:0;color:var(--muted)}
.app-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 26px}.app-card{min-width:0;border-bottom:1px solid var(--line);padding-bottom:28px}
.embed-frame{height:620px;width:100%;background:#f3f6f8;display:flex;align-items:center;justify-content:center;overflow:hidden}
.embed-frame iframe{width:392px;height:620px;border:0;background:#fff;display:block;max-width:100%}
.empty{color:#657586;text-align:center;max-width:230px}.empty b{display:block;font:700 1.3rem Georgia,serif;color:var(--ink);margin-bottom:7px}
.meta{color:var(--muted);font-size:.89rem;margin:0 0 9px}.app-card label{display:block;font-weight:700;font-size:.91rem;margin:15px 0 5px}
.app-card input,.app-card textarea{display:block;width:100%;border:1px solid #aebdca;background:#fff;color:var(--ink);padding:10px 11px;border-radius:0}
.app-card textarea{min-height:67px;resize:vertical}.app-card input:focus,.app-card textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
.hint{color:var(--muted);font-size:.82rem;margin:4px 0 0}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:17px}
.save,.submit{border:0;background:var(--blue);color:#fff;font-weight:700;padding:10px 15px}.submit{background:#4e4669}.status{font-size:.87rem;color:var(--muted)}
.notice{border-left:3px solid var(--blue);padding:8px 0 8px 15px;margin:25px 0 35px;max-width:770px}.notice p{margin:0}
.loading{font:700 1.35rem Georgia,serif;padding:40px 0}.error{color:#8b1d27}
@media(max-width:900px){.app-grid{grid-template-columns:1fr}.embed-frame{height:620px}header,main{padding-left:22px;padding-right:22px}}
@media print{nav,.course-picker,.actions,.jump{display:none}.app-grid{grid-template-columns:1fr 1fr}.embed-frame{height:300px}.embed-frame iframe{height:300px}section{break-inside:avoid}}
</style></head><body>

<script>
const main=document.getElementById('main'),courseSelect=document.getElementById('courseSelect');
let state=null,page='practice';
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;};
const clear=n=>{while(n.firstChild)n.removeChild(n.firstChild);};
const setStatus=(card,text,error=false)=>{const n=card.querySelector('.status');n.textContent=text;n.classList.toggle('error',error);};

function load(courseId){main.innerHTML='<div class="loading">Opening your portfolio…</div>';
  google.script.run.withSuccessHandler(data=>{state=data;
    clear(courseSelect);data.courses.forEach(c=>{const o=el('option','',c.name+(c.section?' | '+c.section:''));o.value=c.id;o.selected=c.id===data.courseId;courseSelect.append(o);});
    document.getElementById('greeting').textContent=`${data.studentName}'s work lives here. Add an app link, explain its purpose, and name the UI pieces you used.`;
    render();}).withFailureHandler(e=>{main.textContent=e.message;main.className='error';}).getPortfolioData(courseId||'');
}
function heading(title,guide){const h=el('h2','',title),p=el('p','guide',guide);main.append(h,p);}
function section(title,id,apps,description){const s=el('section','section');s.id=id;const head=el('div','section-head');
  const name=el('h3','',title),note=el('p','',description||'');head.append(name,note);s.append(head);
  const grid=el('div','app-grid');apps.forEach(app=>grid.append(appCard(app)));s.append(grid);main.append(s);}
function render(){clear(main);main.className='';
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'));
  if(page==='practice'){
    heading('Practice apps','All 54 ideas live on this page. Build the scheduled app first, then try a swap when you want another purpose for the same UI skill.');
    const jump=el('div','jump');for(let week=1;week<=3;week++){const a=el('a','',`Jump to week ${week}`);a.href='#week'+week;jump.append(a);}main.append(jump);
    for(let group=1;group<=18;group++){const apps=state.apps.filter(a=>a.group===group);
      const week=Math.floor((group-1)/6)+1,meeting=Math.floor((group-1)/3)+1,cycle=(group-1)%3+1;
      section(`Week ${week}, class ${meeting}, build ${cycle}`,group===1?'week1':group===7?'week2':group===13?'week3':'build'+group,apps,
        'First app is the class build. The next two use the same skill.');}
  }else if(page==='gallery'){
    heading('App gallery','Minor-grade apps appear here. Each card points to the same saved app on the Practice page. Submit for check only after you have tested it.');
    const n=el('div','notice');n.append(el('p','','A ready submission counts as an attempt. Running, editing, and saving do not. Your teacher will check what the app does.'));main.append(n);
    for(let week=1;week<=3;week++){const apps=state.apps.filter(a=>a.category==='minor'&&a.week===week);
      section(`Week ${week} gallery`,'gallery'+week,apps,apps.length+' minor app slots');}
  }else{
    heading('Major projects','Two larger builds combine familiar controls. Each has five functional checks worth 20 points each.');
    const details=el('div','notice');details.append(el('p','','Study Sprint Plan: task input, duration menu, quiet checkbox, plan button, result label. Focus Break Coach: radio choice, minutes slider, note area, suggestion button, result label.'));main.append(details);
    section('Your two major builds','majorBuilds',state.apps.filter(a=>a.category==='major'),'Two projects');
  }
}
function appCard(app){const card=el('article','app-card');card.dataset.id=app.appId;
  const frame=el('div','embed-frame');
  if(app.embedUrl){const iframe=el('iframe');iframe.src=app.embedUrl;iframe.title=app.title+' app preview';iframe.loading='lazy';frame.append(iframe);}
  else{const empty=el('div','empty');empty.append(el('b','','Your app goes here'),el('span','','Paste a Code.org Share link below, then save.'));frame.append(empty);}
  card.append(frame,el('h3','',app.title));
  const meta=el('p','meta',app.category==='major'?'Major project':app.category==='minor'?'Minor-grade build':'Practice idea');card.append(meta);
  const purposeLabel=el('label','','One-sentence purpose');const purpose=el('textarea');purpose.value=app.purpose||'';purpose.maxLength=240;purpose.placeholder='This app helps someone…';purposeLabel.append(purpose);card.append(purposeLabel);
  const elementsLabel=el('label','','UI elements I used');const elements=el('input');elements.type='text';elements.value=app.uiElements||'';elements.maxLength=240;elements.placeholder='Button, Label, Text Input…';elementsLabel.append(elements);card.append(elementsLabel);
  const urlLabel=el('label','','App Lab Share link');const url=el('input');url.type='url';url.value=app.shareUrl||'';url.placeholder='https://studio.code.org/projects/applab/…';urlLabel.append(url);card.append(urlLabel);
  card.append(el('p','hint','Use Share in App Lab. The preview appears above after you save.'));
  const actions=el('div','actions'),save=el('button','save','Save this app');save.type='button';actions.append(save);
  if(page==='gallery'){const submit=el('button','submit','Submit for check');submit.type='button';actions.append(submit);
    submit.addEventListener('click',()=>{if(!confirm('Submit this app for a teacher check? This counts as a ready attempt.'))return;
      persist(card,app,()=>{google.script.run.withSuccessHandler(result=>{app.attempts=result.attempts;app.readyAt=result.readyAt;setStatus(card,`Ready attempt ${result.attempts} recorded.`);})
        .withFailureHandler(e=>setStatus(card,e.message,true)).submitMinor(state.courseId,app.appId);});});}
  actions.append(el('span','status',app.readyAt?`Ready attempt ${app.attempts} recorded.`:app.updatedAt?'Saved.':''));card.append(actions);
  save.addEventListener('click',()=>persist(card,app));return card;}
function persist(card,app,after){const fields=card.querySelectorAll('textarea,input');const payload={courseId:state.courseId,appId:app.appId,
  purpose:fields[0].value,uiElements:fields[1].value,shareUrl:fields[2].value};
  setStatus(card,'Saving…');
  google.script.run.withSuccessHandler(result=>{Object.assign(app,result);setStatus(card,'Saved.');
    const frame=card.querySelector('.embed-frame');if(result.embedUrl){clear(frame);const iframe=el('iframe');iframe.src=result.embedUrl;iframe.title=app.title+' app preview';iframe.loading='lazy';frame.append(iframe);}
    if(after)after();}).withFailureHandler(e=>setStatus(card,e.message,true)).saveApp(payload);}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;history.replaceState(null,'','#'+page);render();window.scrollTo(0,0);}));
courseSelect.addEventListener('change',()=>load(courseSelect.value));
const requested=location.hash.replace('#','');if(['practice','gallery','majors'].includes(requested))page=requested;
load('');
</script></body></html>
