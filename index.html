<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pit Crew</title>

  <style>
    :root {
      --navy: #00205b;
      --blue: #6495ed;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--navy);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: min(90%, 700px);
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 12px;
      color: var(--blue);
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 12vw, 7rem);
      line-height: 0.9;
      letter-spacing: -0.05em;
      text-transform: uppercase;
    }

    .divider {
      width: 60px;
      height: 5px;
      margin: 28px auto;
      background: var(--blue);
    }

    p {
      margin: 0 auto 36px;
      max-width: 500px;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      min-width: 190px;
      padding: 16px 24px;

      border: 2px solid var(--blue);
      background: var(--blue);
      color: var(--navy);

      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;

      transition: background 0.15s ease, color 0.15s ease;
    }

    .button:hover {
      background: var(--white);
      border-color: var(--white);
    }

    .button.secondary {
      background: transparent;
      color: var(--white);
    }

    .button.secondary:hover {
      background: var(--white);
      color: var(--navy);
    }

    @media (max-width: 500px) {
      .links {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main>
    <div class="eyebrow">School Spirit Starts Here</div>

    <h1>Pit Crew</h1>

    <div class="divider"></div>

    <p>
      Your home base for pep rally games, team activities, and Pit Crew resources.
    </p>

    <div class="links">
      <a class="button" href="/quiz">
        Team Quiz
      </a>

      <a
        class="button secondary"
        href="https://game-bank-phi.vercel.app/"
      >
        Game Bank
      </a>
    </div>
  </main>

</body>
</html>
